name: Build Android APK (Hatsune Miku Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Generate Fresh Android Platform
        working-directory: mobile_app
        run: |
          rm -rf android test
          flutter create --org com.akari --project-name akari_retail --platforms android .
          rm -rf test
          python3 - << 'EOF'
          import os, re

          # 1. Patch AndroidManifest.xml cleanly (add permissions & cleartext HTTP)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()

          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          """
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "\n    <application", 1)
          if "usesCleartextTraffic" not in m:
              m = m.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)

          with open(manifest_path, "w") as f:
              f.write(m)

          # 2. Patch build.gradle or build.gradle.kts for minSdk 23 and compileSdk 35
          for gpath in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(gpath):
                  with open(gpath, "r") as f:
                      g = f.read()
                  g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g)
                  g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', g)
                  g = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35', g)
                  g = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 35', g)
                  with open(gpath, "w") as f:
                      f.write(g)
          EOF

      - name: Get Dependencies & Analyze Dart Code
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build APK Release
        working-directory: mobile_app
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akari-retail-miku-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
